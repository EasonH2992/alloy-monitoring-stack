global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 各 docker 主機的資料由 Alloy 透過 remote_write 推進來，這裡「不需要」列主機 IP。
# 下面只 scrape 監控中心自己的元件。

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { host: monitoring-server }

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels: { host: monitoring-server }

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels: { host: monitoring-server }
